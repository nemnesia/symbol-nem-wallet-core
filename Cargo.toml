[package]
name = "symbol-nem-wallet-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Symbol and NEM wallet core"

[workspace]
resolver = "2"
members = ["bindings/native"]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
wasm = ["dep:js-sys", "dep:wasm-bindgen"]

[dependencies]
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"] }
argon2 = { version = "0.5.3", default-features = false, features = ["alloc"] }
bip39 = { version = "2.1.0", features = ["zeroize"] }
curve25519-dalek = { version = "4.1.3", default-features = false, features = ["alloc", "precomputed-tables", "zeroize"] }
getrandom = { version = "0.3.4", features = ["wasm_js"] }
hmac = "0.12.1"
ripemd = "0.1.3"
sha2 = "0.10.9"
sha3 = "0.10.8"
unicode-normalization = "0.1.24"
uuid = { version = "1.18.1", default-features = false }
js-sys = { version = "0.3.77", optional = true }
wasm-bindgen = { version = "0.2.105", optional = true }
zeroize = { version = "1.8.2", features = ["derive"] }

[patch.crates-io]
# Local security patch for secret-scalar temporaries; see the decision record
# and third-party patch notes before upgrading or removing this override.
curve25519-dalek = { path = "third_party/curve25519-dalek-4.1.3" }

[dev-dependencies]
hex = "0.4.3"
wasm-bindgen-test = "0.3.55"
