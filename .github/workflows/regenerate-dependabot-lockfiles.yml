name: Regenerate Dependabot lockfiles

on:
  push:
    branches:
      - agent/fix-dependabot-alerts-5-8

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/fix-dependabot-alerts-5-8
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Enable Corepack
        run: corepack enable
      - name: Regenerate pnpm lockfile
        run: pnpm install --lockfile-only
      - name: Regenerate React Native consumer lockfile
        working-directory: integration/react-native/consumer
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit regenerated lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml integration/react-native/consumer/package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(deps): regenerate patched dependency locks"
          git push
