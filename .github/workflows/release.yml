name: Release operation

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  identity:
    name: Validate release identity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out release tag with complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Install Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.x"

      - name: Ensure the repository main ref is available
        run: git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main

      - name: Run release identity deterministic tests
        run: node scripts/test-release-identity.mjs

      - name: Run release operation deterministic tests
        run: node scripts/test-release-operation.mjs

      - name: Validate release identity and npm version availability
        run: node scripts/release-identity.mjs --mode release | tee release-identity.json

      - name: Upload release identity evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-identity
          path: release-identity.json

  candidate:
    name: Build and validate formal release candidate
    needs: identity
    uses: ./.github/workflows/node.yml
    with:
      release_mode: release
      release_tag: ${{ github.ref_name }}
    permissions:
      contents: read

  c-abi:
    name: Build and validate formal C ABI release assets
    needs: [identity, candidate]
    uses: ./.github/workflows/c-abi-release.yml
    with:
      release_mode: release
      release_tag: ${{ github.ref_name }}
    permissions:
      contents: read

  release-record:
    name: Assemble unified release evidence record
    needs: [identity, candidate, c-abi]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      - name: Install Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.x"

      - name: Download final npm evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-npm-package
          path: release-npm-input

      - name: Download final C ABI evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-c-abi
          path: release-c-abi-input

      - name: Generate and validate pre-publish unified release record
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-record.mjs generate \
            --mode release \
            --tag "$GITHUB_REF_NAME" \
            --source-commit "$GITHUB_SHA" \
            --provenance-status required-at-publish \
            --npm-dir release-npm-input \
            --c-abi-dir release-c-abi-input \
            --output release-record-output
          node scripts/release-record.mjs validate \
            --mode release \
            --tag "$GITHUB_REF_NAME" \
            --source-commit "$GITHUB_SHA" \
            --provenance-status required-at-publish \
            --npm-dir release-npm-input \
            --c-abi-dir release-c-abi-input \
            --output release-record-output

      - name: Upload unified release record handoff
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-record
          path: release-record-output/

  publish:
    name: Publish npm package with provenance
    needs: [identity, candidate, c-abi, release-record]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release tag with complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Install Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.x"

      - name: Ensure the repository main ref is available
        run: git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main

      - name: Download release identity evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-identity
          path: release-identity-input

      - name: Download final release evidence bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-npm-package
          path: release-output

      - name: Download C ABI release evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-c-abi
          path: release-c-abi-input

      - name: Download unified release record
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-record
          path: release-record-input

      - name: Download and validate unified release record
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-record.mjs validate \
            --mode release \
            --tag "$GITHUB_REF_NAME" \
            --source-commit "$GITHUB_SHA" \
            --provenance-status required-at-publish \
            --npm-dir release-output \
            --c-abi-dir release-c-abi-input \
            --output release-record-input

      - name: Verify release bundle identity and independent evidence digests
        shell: bash
        env:
          SNWC_RELEASE_ENVIRONMENT: release
        run: |
          set -euo pipefail
          node scripts/release-operation.mjs verify \
            --release-dir release-output \
            --identity release-identity-input/release-identity.json \
            --tag "$GITHUB_REF_NAME" \
            --source-commit "$GITHUB_SHA" \
            --environment "$SNWC_RELEASE_ENVIRONMENT" \
            --output release-output/release-operation.json

      - name: Verify GitHub Actions OIDC runtime context
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF" = "refs/tags/$GITHUB_REF_NAME"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"

      - name: Publish the exact release tarball with required npm provenance
        shell: bash
        run: |
          set -euo pipefail
          tarball="$(node --input-type=module -e 'const fs = await import("node:fs"); const path = await import("node:path"); const manifest = JSON.parse(fs.readFileSync("release-output/release-manifest.json", "utf8")); process.stdout.write(path.resolve("release-output", manifest.npm_tarball.filename))')"
          test -f "$tarball"
          npm publish --provenance --access public "$tarball"

      - name: Upload release operation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-operation
          path: release-output/release-operation.json
