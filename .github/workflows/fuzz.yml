name: Wallet Store fuzzing

on:
  schedule:
    - cron: "23 3 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wallet-store-decode:
    name: Wallet Store decoder fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install nightly Rust toolchain
        uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
        with:
          toolchain: nightly

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2
        with:
          tool: cargo-fuzz@0.13.2

      - name: Fuzz Wallet Store decoder
        run: bash scripts/ci/fuzz-wallet-store.sh

      - name: Upload fuzz artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: wallet-store-fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
