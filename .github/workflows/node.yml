name: Node-API addon smoke

on:
  push:
    branches:
      - main
    paths:
      - "crates/core/**"
      - "crates/node/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/node.yml"
  pull_request:
    paths:
      - "crates/core/**"
      - "crates/node/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/node.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  addon-smoke:
    name: ${{ matrix.platform }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows x64
            runner: windows-2025-vs2026
            node: "22.x"
          - platform: Windows x64
            runner: windows-2025-vs2026
            node: "24.x"
          - platform: macOS x64
            runner: macos-15-intel
            node: "22.x"
          - platform: macOS x64
            runner: macos-15-intel
            node: "24.x"
          - platform: macOS arm64
            runner: macos-15
            node: "22.x"
          - platform: macOS arm64
            runner: macos-15
            node: "24.x"
          - platform: Linux x64 glibc
            runner: ubuntu-24.04
            node: "22.x"
          - platform: Linux x64 glibc
            runner: ubuntu-24.04
            node: "24.x"
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}

      - name: Check Node-API runtime
        shell: bash
        run: |
          node --version
          node -p 'process.versions.napi'

      - name: Build Node-API addon
        run: |
          cargo build --package symbol-nem-wallet-core-node --release --locked

      - name: Resolve built addon
        id: addon
        shell: bash
        run: |
          addon_path="$(find target/release -maxdepth 1 -type f \( \
            -name 'libsymbol_nem_wallet_core_node.so' -o \
            -name 'libsymbol_nem_wallet_core_node.dylib' -o \
            -name 'symbol_nem_wallet_core_node.dll' \
          \) -print -quit)"
          test -n "$addon_path"
          echo "path=$addon_path" >> "$GITHUB_OUTPUT"

      - name: Run addon load and operation smoke
        shell: bash
        run: |
          addon_path="${{ steps.addon.outputs.path }}"
          bash crates/node/tests/run_node_smoke.sh "$addon_path"
