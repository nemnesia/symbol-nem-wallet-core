name: Release candidate validation

on:
  workflow_call:
    inputs:
      release_mode:
        description: "Candidate validation or formal release manifest mode"
        required: false
        default: candidate
        type: string
      release_tag:
        description: "Formal release tag, supplied only for a tag-triggered release"
        required: false
        type: string
  push:
    branches:
      - main
      - agent/react-native-support
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "packages/wallet-core/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/node.yml"
      - ".github/workflows/release-recovery.yml"
      - "integration/react-native/**"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "packages/wallet-core/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/node.yml"
      - ".github/workflows/release-recovery.yml"
      - "integration/react-native/**"
  workflow_dispatch:

concurrency:
  group: node-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  source:
    name: Release source snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Install Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.x"

      - name: Verify checked out source commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Record source and lockfile evidence
        run: node scripts/release-evidence.mjs source | tee release-source.json

      - name: Verify canonical Cargo.lock identity is representation-independent
        run: node scripts/test-release-evidence.mjs

      - name: Run release identity deterministic tests
        run: node scripts/test-release-identity.mjs

      - name: Run release license policy deterministic and negative tests
        run: node scripts/test-release-license-policy.mjs

      - name: Run React Native lifecycle coordinator deterministic tests
        run: node scripts/test-react-native-lifecycle.mjs

      - name: Run React Native Pod graph negative tests
        run: node scripts/test-react-native-pod-lock.mjs

      - name: Run final release evidence deterministic fixtures
        run: |
          node scripts/test-npm-provenance.mjs
          node scripts/test-github-release.mjs
          node scripts/test-release-record.mjs
          node scripts/test-release-recovery.mjs
          node scripts/test-browser-parity.mjs

      - name: Upload source evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: release-source.json

  core-c-abi:
    name: Core and C ABI maintained CI
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    needs: source
    steps:
      - name: Check out release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run Core and binding tests
        run: cargo test --workspace --all-features --locked

      - name: Build C ABI release artifact
        run: cargo build --package symbol-nem-wallet-core-native --release --locked

      - name: Compile public C ABI header
        run: cc -std=c11 -Wall -Wextra -Werror -I crates/c-abi/include -fsyntax-only crates/c-abi/tests/header_compile.c

      - name: Run C ABI runtime test
        run: ./crates/c-abi/tests/run_c_abi_runtime.sh

  wasm:
    name: WASM release artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: source
    steps:
      - name: Check out release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Install Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.x"

      - name: Verify checked out source commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install wasm-bindgen CLI from Cargo.lock
        shell: bash
        run: |
          version="$(node scripts/wasm-bindgen-version.mjs)"
          cargo install wasm-bindgen-cli --version "$version" --locked --root "$RUNNER_TEMP/snwc-wasm-bindgen"

      - name: Verify wasm-bindgen schema version equality
        env:
          WASM_BINDGEN_BIN: ${{ runner.temp }}/snwc-wasm-bindgen/bin/wasm-bindgen
        run: |
          mkdir -p release-wasm
          node scripts/verify-wasm-bindgen.mjs | tee release-wasm/wasm-bindgen-version.json

      - name: Build the only WASM source
        run: cargo build --package symbol-nem-wallet-core-wasm --target wasm32-unknown-unknown --release --locked

      - name: Record WASM evidence
        shell: bash
        run: |
          mkdir -p release-wasm
          cp "target/wasm32-unknown-unknown/release/symbol_nem_wallet_core_wasm.wasm" release-wasm/
          node scripts/release-evidence.mjs wasm-evidence \
            --wasm release-wasm/symbol_nem_wallet_core_wasm.wasm \
            --source-commit "$GITHUB_SHA" \
            --package-version "$(node -p "require('./packages/wallet-core/package.json').version")" \
            --output release-wasm/wasm-evidence.json

      - name: Upload WASM artifact and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-wasm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: release-wasm/

  native:
    name: ${{ matrix.target_id }} native release artifact
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_id: win32-x64-msvc
            rust_target: x86_64-pc-windows-msvc
            artifact_filename: symbol_nem_wallet_core_node.dll
            runner: windows-2025-vs2026
          - target_id: darwin-x64
            rust_target: x86_64-apple-darwin
            artifact_filename: libsymbol_nem_wallet_core_node.dylib
            runner: macos-15-intel
          - target_id: darwin-arm64
            rust_target: aarch64-apple-darwin
            artifact_filename: libsymbol_nem_wallet_core_node.dylib
            runner: macos-15
          - target_id: linux-x64-gnu
            rust_target: x86_64-unknown-linux-gnu
            artifact_filename: libsymbol_nem_wallet_core_node.so
            runner: ubuntu-24.04
    steps:
      - name: Check out release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - name: Verify checked out source commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Build Node-API addon once per native target
        if: matrix.target_id != 'linux-x64-gnu'
        run: cargo build --package symbol-nem-wallet-core-node --target ${{ matrix.rust_target }} --release --locked

      - name: Build Linux addon against the glibc 2.28 compatibility image
        if: matrix.target_id == 'linux-x64-gnu'
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(rustc -Vv | sed -n 's/^release: //p')"
          test -n "$toolchain"
          docker run --rm \
            --env RUST_TOOLCHAIN="$toolchain" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            quay.io/pypa/manylinux_2_28_x86_64:latest \
            bash -lc '
              set -euo pipefail
              curl --fail --silent --show-error --location https://sh.rustup.rs | sh -s -- -y --profile minimal
              source "$HOME/.cargo/env"
              rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target x86_64-unknown-linux-gnu
              cargo +"$RUST_TOOLCHAIN" build --package symbol-nem-wallet-core-node --target x86_64-unknown-linux-gnu --release --locked
            '

      - name: Normalize and record native artifact evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-native
          artifact_path="target/${{ matrix.rust_target }}/release/${{ matrix.artifact_filename }}"
          test -f "$artifact_path"
          cp "$artifact_path" "release-native/${{ matrix.target_id }}.node"
          node scripts/release-evidence.mjs native-evidence \
            --target-id "${{ matrix.target_id }}" \
            --rust-target "${{ matrix.rust_target }}" \
            --artifact "release-native/${{ matrix.target_id }}.node" \
            --source-commit "$GITHUB_SHA" \
            --package-version "$(node -p "require('./packages/wallet-core/package.json').version")" \
            --output "release-native/${{ matrix.target_id }}.json"

      - name: Upload native artifact and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-native-${{ matrix.target_id }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: release-native/

  react-native:
    name: ${{ matrix.target_id }} React Native New Architecture artifact
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_id: android-arm64-v8a
            platform: android
            rust_target: aarch64-linux-android
            runner: ubuntu-24.04
            android_abi: arm64-v8a
          - target_id: android-x86_64
            platform: android
            rust_target: x86_64-linux-android
            runner: ubuntu-24.04
            android_abi: x86_64
          - target_id: ios-arm64
            platform: ios
            rust_target: aarch64-apple-ios
            runner: macos-15
            xcode_sdk: iphoneos
          - target_id: ios-simulator-arm64
            platform: ios
            rust_target: aarch64-apple-ios-sim
            runner: macos-15
            xcode_sdk: iphonesimulator
    steps:
      - name: Check out release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Install Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.x"

      - name: Install JDK 17 for the Android consumer
        if: matrix.platform == 'android'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK and NDK for the clean consumer
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Install the exact Android build inputs
        if: matrix.platform == 'android'
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.1.12297006"
          if [[ "${{ matrix.target_id }}" == "android-x86_64" ]]; then
            sdkmanager \
              "emulator" \
              "system-images;android-35;google_apis;x86_64"
          fi

      - name: Configure the NDK linker for the C ABI target
        if: matrix.platform == 'android'
        shell: bash
        run: |
          set -euo pipefail
          ndk_toolchain="$ANDROID_HOME/ndk/27.1.12297006/toolchains/llvm/prebuilt/linux-x86_64"
          test -x "$ndk_toolchain/bin/aarch64-linux-android24-clang"
          test -x "$ndk_toolchain/bin/x86_64-linux-android24-clang"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$ndk_toolchain/bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$ndk_toolchain/bin/x86_64-linux-android24-clang" >> "$GITHUB_ENV"

      - name: Prepare the macOS runner Ruby for the CocoaPods consumer
        if: matrix.platform == 'ios'
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3.8"
          bundler: "2.5.22"
          bundler-cache: false

      - name: Verify the source-controlled Ruby/CocoaPods lock input
        if: matrix.platform == 'ios'
        shell: bash
        run: |
          set -euo pipefail
          test "$(ruby -e 'print RUBY_VERSION')" = "3.3.8"
          bundle --version
          node scripts/build-react-native-release.mjs verify

      - name: Install pinned Rust toolchain for the existing C ABI
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - name: Verify source-controlled React Native consumer producer
        run: node scripts/build-react-native-release.mjs verify

      - name: Build the existing C ABI for the RN target
        run: cargo build --package symbol-nem-wallet-core-native --target ${{ matrix.rust_target }} --release --locked

      - name: Build Android appmodules and register the C++ provider
        if: matrix.platform == 'android'
        env:
          SNWC_RN_LIFECYCLE_INTEGRATION_TEST: "1"
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-react-native-release.mjs android \
            --target-id "${{ matrix.target_id }}" \
            --c-abi "$GITHUB_WORKSPACE/target/${{ matrix.rust_target }}/release/libsymbol_nem_wallet_core_native.a" \
            --output "release-react-native/${{ matrix.target_id }}/libsymbol_nem_wallet_core_rn.so" \
            --consumer-apk-output "release-react-native/${{ matrix.target_id }}/consumer.apk"

      - name: Load the x86_64 provider in a clean Android emulator
        if: matrix.target_id == 'android-x86_64'
        shell: bash
        run: |
          set -euo pipefail
          avd_name="snwc-rn-x86-64"
          avd_home="$RUNNER_TEMP/snwc-android-avd"
          emulator_log="$RUNNER_TEMP/snwc-android-emulator.log"
          mkdir -p "$avd_home"
          export ANDROID_AVD_HOME="$avd_home"
          android_sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?ANDROID_SDK_ROOT is not set}}"
          export PATH="$android_sdk/emulator:$android_sdk/platform-tools:$PATH"
          command -v avdmanager
          command -v emulator
          command -v adb
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          accel_check_log="$RUNNER_TEMP/snwc-android-accel-check.log"
          if ! emulator -accel-check >"$accel_check_log" 2>&1; then
            echo "Android Emulator hardware acceleration check failed:"
            cat "$accel_check_log" || true
            exit 1
          fi
          cat "$accel_check_log"
          if ! grep -Eiq 'KVM.*is installed and usable' "$accel_check_log"; then
            echo "KVM is not usable on this runner; refusing software emulation."
            exit 1
          fi
          printf 'no\n' | avdmanager create avd \
            --force \
            --name "$avd_name" \
            --package "system-images;android-35;google_apis;x86_64" \
            --device "pixel_2"
          adb start-server
          adb devices
          emulator -avd "$avd_name" \
            -no-window \
            -gpu swiftshader_indirect \
            -no-snapshot \
            -noaudio \
            -no-boot-anim \
            -accel on >"$emulator_log" 2>&1 &
          emulator_pid=$!
          logcat_log="$RUNNER_TEMP/snwc-android-logcat.log"
          launch_log="$RUNNER_TEMP/snwc-android-launch.log"
          smoke_ui_dump="$RUNNER_TEMP/snwc-android-ui.xml"
          logcat_pid=""
          stop_logcat() {
            if [[ -n "$logcat_pid" ]]; then
              kill "$logcat_pid" >/dev/null 2>&1 || true
              wait "$logcat_pid" >/dev/null 2>&1 || true
              logcat_pid=""
            fi
          }
          cleanup() {
            stop_logcat
            adb emu kill >/dev/null 2>&1 || true
            kill "$emulator_pid" >/dev/null 2>&1 || true
          }
          diagnostics() {
            stop_logcat
            echo "::group::Android emulator diagnostics"
            echo "adb devices -l:"
            timeout 10s adb devices -l || true
            echo "adb shell getprop:"
            timeout 10s adb shell getprop || true
            echo "application pid:"
            timeout 10s adb shell pidof com.snwcrnbuild || true
            echo "application process:"
            timeout 10s adb shell ps -A | grep com.snwcrnbuild || true
            echo "activity state:"
            timeout 10s adb shell dumpsys activity top || true
            echo "application exit-info:"
            timeout 10s adb shell dumpsys activity exit-info com.snwcrnbuild || true
            echo "launch result:"
            cat "$launch_log" || true
            echo "smoke UI hierarchy:"
            timeout 10s adb shell uiautomator dump /sdcard/snwc-rn-smoke.xml || true
            timeout 10s adb shell cat /sdcard/snwc-rn-smoke.xml || true
            echo "emulator process status:"
            if kill -0 "$emulator_pid" 2>/dev/null; then
              echo "emulator process $emulator_pid is running"
            else
              echo "emulator process $emulator_pid is not running"
            fi
            ps -p "$emulator_pid" -o pid=,stat=,cmd= || true
            echo "emulator log:"
            cat "$emulator_log" || true
            echo "React Native / Hermes / TurboModule / native loader logcat:"
            grep -Ei 'SNWC_RN|ReactNative|Hermes|TurboModule|SoLoader|linker|dlopen|UnsatisfiedLinkError|FATAL EXCEPTION|AndroidRuntime|com\.snwcrnbuild' "$logcat_log" || true
            echo "continuous logcat:"
            cat "$logcat_log" || true
            echo "::endgroup::"
          }
          trap cleanup EXIT
          if ! timeout 180s adb wait-for-device; then
            echo "Android emulator did not become available before timeout."
            diagnostics
            exit 1
          fi
          booted=false
          for attempt in $(seq 1 90); do
            boot_completed="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [[ "$boot_completed" == "1" ]]; then
              booted=true
              break
            fi
            sleep 2
          done
          if [[ "$booted" != true ]]; then
            echo "Android emulator did not report sys.boot_completed=1 before timeout."
            diagnostics
            exit 1
          fi
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          timeout 120s adb install -r "release-react-native/${{ matrix.target_id }}/consumer.apk"
          : > "$logcat_log"
          timeout 30s adb logcat -c
          adb logcat -v threadtime >"$logcat_log" 2>&1 &
          logcat_pid=$!
          if ! timeout 30s adb shell am start -W -n com.snwcrnbuild/.MainActivity >"$launch_log" 2>&1; then
            echo "Android MainActivity did not start successfully."
            diagnostics
            exit 1
          fi
          cat "$launch_log"
          if ! grep -Eq '^Status: ok$' "$launch_log"; then
            echo "Android MainActivity launch did not report Status: ok."
            diagnostics
            exit 1
          fi
          smoke_pass=false
          for attempt in $(seq 1 90); do
            if grep -Fq 'SNWC_RN_NATIVE_SMOKE_PASS:16' "$logcat_log"; then
              smoke_pass=true
              break
            fi
            sleep 2
          done
          if [[ "$smoke_pass" != true ]]; then
            echo "Android RN native smoke did not report SNWC_RN_NATIVE_SMOKE_PASS:16."
            diagnostics
            exit 1
          fi
          echo "Android RN native smoke completion signal:"
          grep -E 'SNWC_RN_NATIVE_PROVIDER_READY|SNWC_RN_NATIVE_SMOKE_PASS:16' "$logcat_log"
          initial_runtime_count="$(grep -Fc 'SNWC_RN_NATIVE_RUNTIME_READY:' "$logcat_log" || true)"
          if [[ "$initial_runtime_count" -ne 1 ]]; then
            echo "Android RN did not produce exactly one initial runtime identity before reload: $initial_runtime_count"
            diagnostics
            exit 1
          fi
          stale_gate=false
          for attempt in $(seq 1 60); do
            if grep -Fq 'SNWC_RN_NATIVE_STALE_GATE_ARMED' "$logcat_log"; then
              stale_gate=true
              break
            fi
            sleep 1
          done
          if [[ "$stale_gate" != true ]]; then
            echo "Android RN stale-output gate was not armed after the initial 16 API smoke."
            diagnostics
            exit 1
          fi
          if ! timeout 30s adb shell am start -W -n com.snwcrnbuild/.MainActivity \
            --ez snwc_rn_lifecycle_reload_request true >"$launch_log" 2>&1; then
            echo "Android RN lifecycle reload request did not reach MainActivity."
            diagnostics
            exit 1
          fi
          echo "Android RN provider/runtime log markers:"
          grep -Ei 'SNWC_RN|ReactNative|Hermes|TurboModule|SoLoader|linker|dlopen|UnsatisfiedLinkError|FATAL EXCEPTION|AndroidRuntime|com\.snwcrnbuild' "$logcat_log" || true
          lifecycle_reload=false
          for attempt in $(seq 1 90); do
            if grep -Fq 'SNWC_RN_NATIVE_LIFECYCLE_RELOAD_REQUESTED' "$logcat_log"; then
              lifecycle_reload=true
              break
            fi
            sleep 2
          done
          if [[ "$lifecycle_reload" != true ]]; then
            echo "Android RN host reload lifecycle marker was not observed."
            diagnostics
            exit 1
          fi
          lifecycle_reload_completed=false
          for attempt in $(seq 1 90); do
            if grep -Fq 'SNWC_RN_NATIVE_LIFECYCLE_RELOAD_COMPLETED' "$logcat_log"; then
              lifecycle_reload_completed=true
              break
            fi
            if grep -Fq 'SNWC_RN_NATIVE_LIFECYCLE_RELOAD_FAILED' "$logcat_log"; then
              break
            fi
            sleep 2
          done
          if [[ "$lifecycle_reload_completed" != true ]]; then
            echo "Android RN ReactHost reload did not complete successfully."
            diagnostics
            exit 1
          fi
          runtime_lines="$(grep 'SNWC_RN_NATIVE_RUNTIME_READY:' "$logcat_log" || true)"
          runtime_count="$(printf '%s\n' "$runtime_lines" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [[ "$runtime_count" -lt 2 ]]; then
            echo "Android RN did not report both old and new runtime identities."
            diagnostics
            exit 1
          fi
          first_runtime="$(printf '%s\n' "$runtime_lines" | sed -n '1p')"
          second_runtime="$(printf '%s\n' "$runtime_lines" | sed -n '2p')"
          runtime_identity() { printf '%s\n' "$1" | sed -E 's/.*"runtime_identity":"([^"]+)".*/\1/'; }
          registration_identity() { printf '%s\n' "$1" | sed -E 's/.*"registration_identity":"([^"]+)".*/\1/'; }
          provider_generation() { printf '%s\n' "$1" | sed -E 's/.*"provider_generation":([0-9]+).*/\1/'; }
          test "$(runtime_identity "$first_runtime")" != "$(runtime_identity "$second_runtime")"
          test "$(registration_identity "$first_runtime")" != "$(registration_identity "$second_runtime")"
          test "$(provider_generation "$first_runtime")" != "$(provider_generation "$second_runtime")"
          stale_rejected_count="$(grep -Fc 'SNWC_RN_NATIVE_STALE_COMPLETION_REJECTED' "$logcat_log" || true)"
          if [[ "$stale_rejected_count" -lt 1 ]]; then
            echo "Android RN stale output-bearing completion was not rejected."
            diagnostics
            exit 1
          fi
          cleanup_pass_count="$(grep -Fc 'SNWC_RN_NATIVE_CLEANUP_PASS:EXACTLY_ONCE' "$logcat_log" || true)"
          if [[ "$cleanup_pass_count" -lt 1 ]]; then
            echo "Android RN stale-output cleanup was not proven exactly once."
            diagnostics
            exit 1
          fi
          smoke_count="$(grep -Fc 'SNWC_RN_NATIVE_SMOKE_PASS:16' "$logcat_log" || true)"
          if [[ "$smoke_count" -lt 2 ]]; then
            echo "Android RN did not complete 16 API smoke in both generations."
            diagnostics
            exit 1
          fi
          if grep -Fq 'SNWC_RN_NATIVE_LIFECYCLE_RELOAD_FAILED' "$logcat_log"; then
            echo "Android RN lifecycle reload reported failure."
            diagnostics
            exit 1
          fi
          echo "Android RN actual ReactHost reload and generation replacement evidence:"
          grep -E 'SNWC_RN_NATIVE_(LIFECYCLE_RELOAD_REQUESTED|LIFECYCLE_RELOAD_COMPLETED|RUNTIME_READY|STALE_COMPLETION_REJECTED|SMOKE_PASS:16)' "$logcat_log"

      - name: Build iOS static archive for the approved slice
        if: matrix.platform == 'ios'
        shell: bash
        env:
          SNWC_RN_LIFECYCLE_INTEGRATION_TEST: "1"
        run: |
          set -euo pipefail
          node scripts/build-react-native-release.mjs ios \
            --target-id "${{ matrix.target_id }}" \
            --c-abi "$GITHUB_WORKSPACE/target/${{ matrix.rust_target }}/release/libsymbol_nem_wallet_core_native.a" \
            --output "release-react-native/${{ matrix.target_id }}/libsymbol_nem_wallet_core_rn.a"

      - name: Independently reproduce and compare the iOS producer archive
        if: matrix.platform == 'ios'
        env:
          SNWC_RN_LIFECYCLE_INTEGRATION_TEST: "1"
        shell: bash
        run: |
          set -euo pipefail
          second_archive="release-react-native/${{ matrix.target_id }}/reproducibility/producer-2.a"
          node scripts/build-react-native-release.mjs ios \
            --target-id "${{ matrix.target_id }}" \
            --c-abi "$GITHUB_WORKSPACE/target/${{ matrix.rust_target }}/release/libsymbol_nem_wallet_core_native.a" \
            --output "$second_archive"
          node scripts/react-native-evidence.mjs compare \
            --target-id "${{ matrix.target_id }}" \
            --first "release-react-native/${{ matrix.target_id }}/libsymbol_nem_wallet_core_rn.a" \
            --second "$second_archive" \
            --source-commit "$GITHUB_SHA" \
            --package-version "$(node -p "require('./packages/wallet-core/package.json').version")" \
            --output "release-react-native/${{ matrix.target_id }}/${{ matrix.target_id }}-reproducibility.json"

      - name: Normalize and record RN artifact identity/provenance
        shell: bash
        env:
          SNWC_RN_RUNNER: ${{ matrix.runner }}
          SNWC_RN_TOOLCHAIN: "RN-0.87.x-${{ matrix.platform }}-${{ matrix.target_id }}"
        run: |
          set -euo pipefail
          artifact_dir="release-react-native/${{ matrix.target_id }}"
          mkdir -p "$artifact_dir"
          node scripts/react-native-evidence.mjs artifact \
            --target-id "${{ matrix.target_id }}" \
            --artifact "$artifact_dir/${{ matrix.platform == 'android' && 'libsymbol_nem_wallet_core_rn.so' || 'libsymbol_nem_wallet_core_rn.a' }}" \
            --artifact-input-filename "${{ matrix.target_id }}/${{ matrix.platform == 'android' && 'libsymbol_nem_wallet_core_rn.so' || 'libsymbol_nem_wallet_core_rn.a' }}" \
            --source-commit "$GITHUB_SHA" \
            --package-version "$(node -p "require('./packages/wallet-core/package.json').version")" \
            --toolchain-identifier "$SNWC_RN_TOOLCHAIN" \
            --runner "$SNWC_RN_RUNNER" \
            --output "$artifact_dir/${{ matrix.target_id }}.json"

      - name: Upload RN target artifact and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-react-native-${{ matrix.target_id }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: release-react-native/

  react-native-ios-xcframework:
    name: Assemble and inspect the React Native iOS XCFramework
    runs-on: macos-15
    timeout-minutes: 45
    needs: react-native
    steps:
      - name: Check out release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Download the two controlled iOS archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-react-native-ios-*
          path: release-ios
          merge-multiple: true

      - name: Prepare the exact Ruby/Bundler input for the iOS consumer
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3.8"
          bundler: "2.5.22"
          bundler-cache: false

      - name: Create and inspect XCFramework after archive generation
        shell: bash
        run: |
          set -euo pipefail
          device_archive="$(find release-ios -type f -path '*/ios-arm64/libsymbol_nem_wallet_core_rn.a' -print -quit)"
          simulator_archive="$(find release-ios -type f -path '*/ios-simulator-arm64/libsymbol_nem_wallet_core_rn.a' -print -quit)"
          test -n "$device_archive"
          test -n "$simulator_archive"
          mkdir -p release-ios-output
          if ! node scripts/build-react-native-release.mjs xcframework \
            --device "$device_archive" \
            --simulator "$simulator_archive" \
            --output release-ios-output/SymbolNemWalletCoreRN.xcframework; then
            echo "Generated XCFramework layout:"
            find release-ios-output/SymbolNemWalletCoreRN.xcframework -maxdepth 2 -print | sort || true
            echo "Generated XCFramework Info.plist format:"
            file release-ios-output/SymbolNemWalletCoreRN.xcframework/Info.plist || true
            od -An -tx1 -N16 release-ios-output/SymbolNemWalletCoreRN.xcframework/Info.plist || true
            echo "Generated XCFramework Info.plist metadata:"
            plutil -p release-ios-output/SymbolNemWalletCoreRN.xcframework/Info.plist || true
            exit 1
          fi

      - name: Install the generated XCFramework through the consumer Podfile
        env:
          SNWC_RN_LIFECYCLE_INTEGRATION_TEST: "1"
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-react-native-release.mjs ios-consumer \
            --xcframework release-ios-output/SymbolNemWalletCoreRN.xcframework \
            --simulator-app-output release-ios-output/SnwcRnBuild.app

      - name: Launch the linked consumer on an iOS simulator
        shell: bash
        run: |
          set -euo pipefail
          simulator_udid="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ && /Booted|Shutdown/ { print $2; exit }')"
          test -n "$simulator_udid"
          app_path=release-ios-output/SnwcRnBuild.app
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_path/Info.plist")"
          test -n "$bundle_id"
          xcrun simctl boot "$simulator_udid" >/dev/null 2>&1 || true
          xcrun simctl bootstatus "$simulator_udid" -b
          xcrun simctl install "$simulator_udid" "$app_path"
          xcrun simctl terminate "$simulator_udid" "$bundle_id" >/dev/null 2>&1 || true
          if ! launch_output="$(xcrun simctl launch "$simulator_udid" "$bundle_id" 2>&1)"; then
            echo "$launch_output"
            echo "Installed app container:"
            xcrun simctl get_app_container "$simulator_udid" "$bundle_id" app || true
            echo "Recent simulator diagnostics:"
            xcrun simctl spawn "$simulator_udid" log show --last 5m --style compact || true
            exit 1
          fi
          echo "$launch_output"
          lifecycle_log="$RUNNER_TEMP/snwc-ios-lifecycle.log"
          refresh_lifecycle_log() {
            xcrun simctl spawn "$simulator_udid" log show --last 5m --style compact >"$lifecycle_log"
          }
          initial_ready=false
          for attempt in $(seq 1 120); do
            refresh_lifecycle_log
            if grep -Fq 'SNWC_RN_NATIVE_SMOKE_PASS:16' "$lifecycle_log" \
              && grep -Fq 'SNWC_RN_NATIVE_STALE_GATE_ARMED' "$lifecycle_log"; then
              initial_ready=true
              break
            fi
            sleep 1
          done
          if [[ "$initial_ready" != true ]]; then
            echo "iOS RN initial smoke or stale-output gate was not observed."
            cat "$lifecycle_log"
            exit 1
          fi
          lifecycle_complete=false
          for attempt in $(seq 1 120); do
            refresh_lifecycle_log
            if grep -Fq 'SNWC_RN_NATIVE_LIFECYCLE_RELOAD_COMPLETED' "$lifecycle_log"; then
              lifecycle_complete=true
              break
            fi
            sleep 1
          done
          if [[ "$lifecycle_complete" != true ]]; then
            echo "iOS RN actual reload completion was not observed."
            cat "$lifecycle_log"
            exit 1
          fi
          grep -Fq 'SNWC_RN_NATIVE_LIFECYCLE_RELOAD_REQUESTED' "$lifecycle_log"
          grep -Fq 'SNWC_RN_NATIVE_STALE_COMPLETION_REJECTED' "$lifecycle_log"
          grep -Fq 'SNWC_RN_NATIVE_CLEANUP_PASS:EXACTLY_ONCE' "$lifecycle_log"
          runtime_lines="$(grep 'SNWC_RN_NATIVE_RUNTIME_READY:' "$lifecycle_log" || true)"
          runtime_count="$(printf '%s\n' "$runtime_lines" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [[ "$runtime_count" -lt 2 ]]; then
            echo "iOS RN did not report both old and new runtime identities."
            cat "$lifecycle_log"
            exit 1
          fi
          first_runtime="$(printf '%s\n' "$runtime_lines" | sed -n '1p')"
          second_runtime="$(printf '%s\n' "$runtime_lines" | sed -n '2p')"
          runtime_identity() { printf '%s\n' "$1" | sed -E 's/.*"runtime_identity":"([^"]+)".*/\1/'; }
          registration_identity() { printf '%s\n' "$1" | sed -E 's/.*"registration_identity":"([^"]+)".*/\1/'; }
          provider_generation() { printf '%s\n' "$1" | sed -E 's/.*"provider_generation":([0-9]+).*/\1/'; }
          test "$(runtime_identity "$first_runtime")" != "$(runtime_identity "$second_runtime")"
          test "$(registration_identity "$first_runtime")" != "$(registration_identity "$second_runtime")"
          test "$(provider_generation "$first_runtime")" != "$(provider_generation "$second_runtime")"
          smoke_count="$(grep -Fc 'SNWC_RN_NATIVE_SMOKE_PASS:16' "$lifecycle_log" || true)"
          if [[ "$smoke_count" -lt 2 ]]; then
            echo "iOS RN did not complete 16 API smoke in both generations."
            cat "$lifecycle_log"
            exit 1
          fi
          echo "iOS RN actual reload and generation replacement evidence:"
          grep -E 'SNWC_RN_NATIVE_(LIFECYCLE_RELOAD_REQUESTED|LIFECYCLE_RELOAD_COMPLETED|RUNTIME_READY|STALE_COMPLETION_REJECTED|SMOKE_PASS:16)' "$lifecycle_log"

      - name: Upload the independently produced XCFramework evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-react-native-xcframework-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: release-ios-output/

  parity-regression:
    name: Native / WASM / npm parity regression
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    needs: source
    steps:
      - name: Check out release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Install Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.x"

      - name: Install lockfile-matched wasm-bindgen CLI
        shell: bash
        run: cargo install wasm-bindgen-cli --version "$(node scripts/wasm-bindgen-version.mjs)" --locked --root "$RUNNER_TEMP/snwc-wasm-bindgen"

      - name: Verify wasm-bindgen version
        env:
          WASM_BINDGEN_BIN: ${{ runner.temp }}/snwc-wasm-bindgen/bin/wasm-bindgen
        run: node scripts/verify-wasm-bindgen.mjs

      - name: Run native / WASM / npm parity regression
        env:
          SNWC_SOURCE_COMMIT: ${{ github.sha }}
          WASM_BINDGEN_BIN: ${{ runner.temp }}/snwc-wasm-bindgen/bin/wasm-bindgen
          SNWC_BROWSER: google-chrome
        run: node scripts/test-npm-parity.mjs

  package:
    name: Final npm release candidate assembly
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: [source, core-c-abi, wasm, native, react-native, react-native-ios-xcframework, parity-regression]
    steps:
      - name: Check out release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Install Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.x"

      - name: Set source-derived reproducibility epoch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          [[ "$epoch" =~ ^[0-9]+$ ]]
          test -n "$epoch"
          echo "SOURCE_DATE_EPOCH=$epoch" >> "$GITHUB_ENV"

      - name: Install pnpm workspace dependencies
        run: corepack pnpm install --frozen-lockfile --ignore-scripts

      - name: Download all native artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-native-*
          path: release-input/native
          merge-multiple: true

      - name: Download source evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-source-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: release-input/source

      - name: Download the canonical WASM artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-wasm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: release-input/wasm

      - name: Download Android React Native target artifacts and evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-react-native-android-*
          path: release-input/react-native
          merge-multiple: true

      - name: Download iOS React Native target artifacts and evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-react-native-ios-*
          path: release-input/react-native
          merge-multiple: true

      - name: Download the independently produced iOS XCFramework
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-react-native-xcframework-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: release-input/react-native-xcframework

      - name: Recheck the independent iOS producer comparison before npm assembly
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./packages/wallet-core/package.json').version")"
          for target in ios-arm64 ios-simulator-arm64; do
            node scripts/react-native-evidence.mjs compare \
              --target-id "$target" \
              --first "release-input/react-native/$target/libsymbol_nem_wallet_core_rn.a" \
              --second "release-input/react-native/$target/reproducibility/producer-2.a" \
              --source-commit "$GITHUB_SHA" \
              --package-version "$package_version" \
              --output "$RUNNER_TEMP/$target-reproducibility.json"
            cmp -- "$RUNNER_TEMP/$target-reproducibility.json" \
              "release-input/react-native/$target/$target-reproducibility.json"
          done

      - name: Validate all artifact evidence before assembly
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-evidence.mjs validate-native \
            --native-root release-input/native \
            --evidence-root release-input/native \
            --source-commit "$GITHUB_SHA" \
            --package-version "$(node -p "require('./packages/wallet-core/package.json').version")" \
            --output release-input/native-summary.json
          node scripts/release-evidence.mjs wasm-evidence \
            --wasm release-input/wasm/symbol_nem_wallet_core_wasm.wasm \
            --evidence release-input/wasm/wasm-evidence.json \
            --source-commit "$GITHUB_SHA" \
            --package-version "$(node -p "require('./packages/wallet-core/package.json').version")" \
            --output release-input/wasm-summary.json
          mkdir -p release-input/react-native/artifacts
          for target in android-arm64-v8a android-x86_64 ios-arm64 ios-simulator-arm64; do
            test -f "release-input/react-native/$target/$target.json"
            cp "release-input/react-native/$target/$target.json" "release-input/react-native/$target.json"
            mkdir -p "release-input/react-native/artifacts/$target"
            cp "release-input/react-native/$target/"libsymbol_nem_wallet_core_rn.* "release-input/react-native/artifacts/$target/"
          done
          node scripts/react-native-evidence.mjs summary \
            --evidence-root release-input/react-native \
            --source-commit "$GITHUB_SHA" \
            --package-version "$(node -p "require('./packages/wallet-core/package.json').version")" \
            --output release-input/react-native-summary.json

      - name: Install and verify the lockfile-matched wasm-bindgen CLI
        shell: bash
        run: |
          version="$(node scripts/wasm-bindgen-version.mjs)"
          cargo install wasm-bindgen-cli --version "$version" --locked --root "$RUNNER_TEMP/snwc-wasm-bindgen"
          WASM_BINDGEN_BIN="$RUNNER_TEMP/snwc-wasm-bindgen/bin/wasm-bindgen" node scripts/verify-wasm-bindgen.mjs

      - name: Assemble the four-target npm package
        shell: bash
        env:
          SNWC_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          toolchain="$(node --input-type=module -e 'const fs = await import("node:fs"); process.stdout.write(JSON.parse(fs.readFileSync("release-input/native-summary.json", "utf8")).toolchain_identifier)')"
          export SNWC_TOOLCHAIN_IDENTIFIER="$toolchain"
          node scripts/build-npm-package.mjs \
            --wasm release-input/wasm/symbol_nem_wallet_core_wasm.wasm \
            --wasm-bindgen-bin "$RUNNER_TEMP/snwc-wasm-bindgen/bin/wasm-bindgen" \
            --native-artifact win32-x64-msvc=release-input/native/win32-x64-msvc.node \
            --native-artifact darwin-x64=release-input/native/darwin-x64.node \
            --native-artifact darwin-arm64=release-input/native/darwin-arm64.node \
            --native-artifact linux-x64-gnu=release-input/native/linux-x64-gnu.node \
            --react-native-artifact android-arm64-v8a=release-input/react-native/artifacts/android-arm64-v8a/libsymbol_nem_wallet_core_rn.so \
            --react-native-evidence android-arm64-v8a=release-input/react-native/android-arm64-v8a.json \
            --react-native-artifact android-x86_64=release-input/react-native/artifacts/android-x86_64/libsymbol_nem_wallet_core_rn.so \
            --react-native-evidence android-x86_64=release-input/react-native/android-x86_64.json \
            --react-native-artifact ios-arm64=release-input/react-native/artifacts/ios-arm64/libsymbol_nem_wallet_core_rn.a \
            --react-native-evidence ios-arm64=release-input/react-native/ios-arm64.json \
            --react-native-artifact ios-simulator-arm64=release-input/react-native/artifacts/ios-simulator-arm64/libsymbol_nem_wallet_core_rn.a \
            --react-native-evidence ios-simulator-arm64=release-input/react-native/ios-simulator-arm64.json \
            --react-native-xcframework release-input/react-native-xcframework/SymbolNemWalletCoreRN.xcframework

      - name: Run final package, clean-install, and fail-closed gates
        env:
          SNWC_REQUIRE_REACT_NATIVE_ARTIFACTS: "true"
        run: node scripts/test-npm-release.mjs

      - name: Write release candidate tarball
        shell: bash
        run: |
          mkdir -p release-output
          npm pack --json --ignore-scripts --pack-destination release-output ./packages/wallet-core > release-output/pack.json
          test "$(find release-output -maxdepth 1 -type f -name '*.tgz' | wc -l)" -eq 1
          rm release-output/pack.json

      - name: Generate release manifest and SHA-256 digest set
        shell: bash
        run: |
          set -euo pipefail
          tarball="$(find release-output -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$tarball"
          manifest_args=(--mode "${RELEASE_MODE}")
          if [[ "${RELEASE_MODE}" == "release" ]]; then
            test -n "${RELEASE_TAG}"
            manifest_args+=(--release-tag "${RELEASE_TAG}")
          fi
          node scripts/release-manifest.mjs generate \
            "${manifest_args[@]}" \
            --source-evidence release-input/source/release-source.json \
            --native-summary release-input/native-summary.json \
            --native-evidence-root release-input/native \
            --react-native-summary release-input/react-native-summary.json \
            --react-native-evidence-root release-input/react-native \
            --react-native-artifact-root release-input/react-native/artifacts \
            --wasm-summary release-input/wasm-summary.json \
            --wasm-evidence release-input/wasm/wasm-evidence.json \
            --wasm-bindgen-evidence release-input/wasm/wasm-bindgen-version.json \
            --wasm-source release-input/wasm/symbol_nem_wallet_core_wasm.wasm \
            --package-root packages/wallet-core \
            --tarball "$tarball" \
            --manifest release-output/release-manifest.json \
            --sha256sums release-output/SHA256SUMS

        env:
          RELEASE_MODE: ${{ inputs.release_mode || 'candidate' }}
          RELEASE_TAG: ${{ inputs.release_tag || '' }}

      - name: Install pinned cargo-sbom generator
        shell: bash
        run: cargo install cargo-sbom --version 0.10.0 --locked --root "$RUNNER_TEMP/snwc-cargo-sbom"

      - name: Capture target-filtered Cargo graph and SPDX generator output
        shell: bash
        run: |
          set -euo pipefail
          input_root="$RUNNER_TEMP/snwc-release-sbom-input"
          mkdir -p "$input_root"
          for target in \
            x86_64-pc-windows-msvc \
            x86_64-apple-darwin \
            aarch64-apple-darwin \
            x86_64-unknown-linux-gnu \
            wasm32-unknown-unknown; do
            cargo metadata \
              --format-version 1 \
              --locked \
              --filter-platform "$target" \
              > "$input_root/cargo-metadata-$target.json"
          done

      - name: Write cargo-sbom generator inputs
        shell: bash
        run: |
          set -euo pipefail
          input_root="$RUNNER_TEMP/snwc-release-sbom-input"
          cargo_sbom="$RUNNER_TEMP/snwc-cargo-sbom/bin/cargo-sbom"
          "$cargo_sbom" --version
          "$cargo_sbom" \
            --cargo-package symbol-nem-wallet-core-node \
            --output-format spdx_json_2_3 \
            > "$input_root/cargo-sbom-node.json"
          "$cargo_sbom" \
            --cargo-package symbol-nem-wallet-core-wasm \
            --output-format spdx_json_2_3 \
            > "$input_root/cargo-sbom-wasm.json"

      - name: Generate and strictly validate SPDX SBOM and license inventory
        shell: bash
        run: |
          set -euo pipefail
          input_root="$RUNNER_TEMP/snwc-release-sbom-input"
          node scripts/release-sbom.mjs generate \
            --source-evidence release-input/source/release-source.json \
            --native-summary release-input/native-summary.json \
            --native-evidence-root release-input/native \
            --react-native-summary release-input/react-native-summary.json \
            --react-native-evidence-root release-input/react-native \
            --react-native-artifact-root release-input/react-native/artifacts \
            --wasm-summary release-input/wasm-summary.json \
            --wasm-evidence release-input/wasm/wasm-evidence.json \
            --wasm-bindgen-evidence release-input/wasm/wasm-bindgen-version.json \
            --wasm-source release-input/wasm/symbol_nem_wallet_core_wasm.wasm \
            --package-root packages/wallet-core \
            --tarball "$(find release-output -maxdepth 1 -type f -name '*.tgz' -print -quit)" \
            --release-manifest release-output/release-manifest.json \
            --release-sha256sums release-output/SHA256SUMS \
            --sbom release-output/sbom.spdx.json \
            --inventory release-output/license-inventory.json \
            --sbom-sha256sums release-output/SBOM-SHA256SUMS \
            --cargo-metadata x86_64-pc-windows-msvc="$input_root/cargo-metadata-x86_64-pc-windows-msvc.json" \
            --cargo-metadata x86_64-apple-darwin="$input_root/cargo-metadata-x86_64-apple-darwin.json" \
            --cargo-metadata aarch64-apple-darwin="$input_root/cargo-metadata-aarch64-apple-darwin.json" \
            --cargo-metadata x86_64-unknown-linux-gnu="$input_root/cargo-metadata-x86_64-unknown-linux-gnu.json" \
            --cargo-metadata wasm32-unknown-unknown="$input_root/cargo-metadata-wasm32-unknown-unknown.json" \
            --cargo-sbom node="$input_root/cargo-sbom-node.json" \
            --cargo-sbom wasm="$input_root/cargo-sbom-wasm.json"

      - name: Generate and strictly validate Phase 4B license policy artifacts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-license-policy.mjs generate \
            --inventory release-output/license-inventory.json \
            --sbom release-output/sbom.spdx.json \
            --sbom-sha256sums release-output/SBOM-SHA256SUMS \
            --policy release-output/license-policy.json \
            --third-party release-output/THIRD_PARTY_LICENSES.json \
            --policy-sha256sums release-output/LICENSE-POLICY-SHA256SUMS

      - name: Enforce final third-party license text gate for formal release
        if: inputs.release_mode == 'release'
        shell: bash
        run: |
          set -euo pipefail
          input_root="$RUNNER_TEMP/snwc-release-sbom-input"
          node scripts/release-license-policy.mjs generate \
            --inventory release-output/license-inventory.json \
            --sbom release-output/sbom.spdx.json \
            --sbom-sha256sums release-output/SBOM-SHA256SUMS \
            --policy release-output/license-policy.json \
            --third-party release-output/THIRD_PARTY_LICENSES.json \
            --policy-sha256sums release-output/LICENSE-POLICY-SHA256SUMS \
            --cargo-metadata x86_64-pc-windows-msvc="$input_root/cargo-metadata-x86_64-pc-windows-msvc.json" \
            --cargo-metadata x86_64-apple-darwin="$input_root/cargo-metadata-x86_64-apple-darwin.json" \
            --cargo-metadata aarch64-apple-darwin="$input_root/cargo-metadata-aarch64-apple-darwin.json" \
            --cargo-metadata x86_64-unknown-linux-gnu="$input_root/cargo-metadata-x86_64-unknown-linux-gnu.json" \
            --cargo-metadata wasm32-unknown-unknown="$input_root/cargo-metadata-wasm32-unknown-unknown.json" \
            --require-third-party-license-text

      - name: Assemble final release evidence bundle
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cp release-input/source/release-source.json release-output/release-source.json
          cp release-input/native-summary.json release-output/native-summary.json
          cp release-input/native/*.json release-output/
          cp release-input/native/*.node release-output/
          cp release-input/wasm-summary.json release-output/wasm-summary.json
          cp release-input/wasm/wasm-evidence.json release-output/wasm-evidence.json
          cp release-input/wasm/wasm-bindgen-version.json release-output/wasm-bindgen-version.json
          cp release-input/react-native-summary.json release-output/react-native-summary.json
          cp release-input/react-native/*.json release-output/
          cp packages/wallet-core/dist/react-native/artifact-manifest.json release-output/react-native-artifact-manifest.json
          cp release-input/react-native/artifacts/android-arm64-v8a/libsymbol_nem_wallet_core_rn.so release-output/android-arm64-v8a.so
          cp release-input/react-native/artifacts/android-x86_64/libsymbol_nem_wallet_core_rn.so release-output/android-x86_64.so
          cp release-input/react-native/artifacts/ios-arm64/libsymbol_nem_wallet_core_rn.a release-output/ios-arm64.a
          cp release-input/react-native/artifacts/ios-simulator-arm64/libsymbol_nem_wallet_core_rn.a release-output/ios-simulator-arm64.a

      - name: Re-validate final release manifest and SHA-256 digest set
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          tarball="$(find release-output -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$tarball"
          node scripts/release-manifest.mjs validate \
            --source-evidence release-output/release-source.json \
            --native-summary release-output/native-summary.json \
            --native-evidence-root release-output \
            --react-native-summary release-output/react-native-summary.json \
            --react-native-evidence-root release-output \
            --react-native-artifact-root release-input/react-native/artifacts \
            --wasm-summary release-output/wasm-summary.json \
            --wasm-evidence release-output/wasm-evidence.json \
            --wasm-bindgen-evidence release-output/wasm-bindgen-version.json \
            --wasm-source release-input/wasm/symbol_nem_wallet_core_wasm.wasm \
            --package-root packages/wallet-core \
            --tarball "$tarball" \
            --manifest release-output/release-manifest.json \
            --sha256sums release-output/SHA256SUMS

      - name: Re-validate final SPDX SBOM and license inventory bundle
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          input_root="$RUNNER_TEMP/snwc-release-sbom-input"
          tarball="$(find release-output -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$tarball"
          node scripts/release-sbom.mjs validate \
            --source-evidence release-output/release-source.json \
            --native-summary release-output/native-summary.json \
            --native-evidence-root release-output \
            --react-native-summary release-output/react-native-summary.json \
            --react-native-evidence-root release-output \
            --react-native-artifact-root release-input/react-native/artifacts \
            --wasm-summary release-output/wasm-summary.json \
            --wasm-evidence release-output/wasm-evidence.json \
            --wasm-bindgen-evidence release-output/wasm-bindgen-version.json \
            --wasm-source release-input/wasm/symbol_nem_wallet_core_wasm.wasm \
            --package-root packages/wallet-core \
            --tarball "$tarball" \
            --release-manifest release-output/release-manifest.json \
            --release-sha256sums release-output/SHA256SUMS \
            --sbom release-output/sbom.spdx.json \
            --inventory release-output/license-inventory.json \
            --sbom-sha256sums release-output/SBOM-SHA256SUMS \
            --cargo-metadata x86_64-pc-windows-msvc="$input_root/cargo-metadata-x86_64-pc-windows-msvc.json" \
            --cargo-metadata x86_64-apple-darwin="$input_root/cargo-metadata-x86_64-apple-darwin.json" \
            --cargo-metadata aarch64-apple-darwin="$input_root/cargo-metadata-aarch64-apple-darwin.json" \
            --cargo-metadata x86_64-unknown-linux-gnu="$input_root/cargo-metadata-x86_64-unknown-linux-gnu.json" \
            --cargo-metadata wasm32-unknown-unknown="$input_root/cargo-metadata-wasm32-unknown-unknown.json" \
            --cargo-sbom node="$input_root/cargo-sbom-node.json" \
            --cargo-sbom wasm="$input_root/cargo-sbom-wasm.json"

      - name: Re-validate final Phase 4B license policy bundle
        if: always() && inputs.release_mode != 'release'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-license-policy.mjs validate \
            --inventory release-output/license-inventory.json \
            --sbom release-output/sbom.spdx.json \
            --sbom-sha256sums release-output/SBOM-SHA256SUMS \
            --policy release-output/license-policy.json \
            --third-party release-output/THIRD_PARTY_LICENSES.json \
            --policy-sha256sums release-output/LICENSE-POLICY-SHA256SUMS

      - name: Re-validate final formal release license policy bundle
        if: always() && inputs.release_mode == 'release'
        shell: bash
        run: |
          set -euo pipefail
          input_root="$RUNNER_TEMP/snwc-release-sbom-input"
          node scripts/release-license-policy.mjs validate \
            --inventory release-output/license-inventory.json \
            --sbom release-output/sbom.spdx.json \
            --sbom-sha256sums release-output/SBOM-SHA256SUMS \
            --policy release-output/license-policy.json \
            --third-party release-output/THIRD_PARTY_LICENSES.json \
            --policy-sha256sums release-output/LICENSE-POLICY-SHA256SUMS \
            --cargo-metadata x86_64-pc-windows-msvc="$input_root/cargo-metadata-x86_64-pc-windows-msvc.json" \
            --cargo-metadata x86_64-apple-darwin="$input_root/cargo-metadata-x86_64-apple-darwin.json" \
            --cargo-metadata aarch64-apple-darwin="$input_root/cargo-metadata-aarch64-apple-darwin.json" \
            --cargo-metadata x86_64-unknown-linux-gnu="$input_root/cargo-metadata-x86_64-unknown-linux-gnu.json" \
            --cargo-metadata wasm32-unknown-unknown="$input_root/cargo-metadata-wasm32-unknown-unknown.json" \
            --require-third-party-license-text

      - name: Upload final npm release candidate evidence bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-npm-package-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: release-output/

  npm-consumer:
    name: ${{ matrix.platform }} / Node ${{ matrix.node }} clean tarball consumer
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows x64
            runner: windows-2025-vs2026
            node: "22.x"
          - platform: Windows x64
            runner: windows-2025-vs2026
            node: "24.x"
          - platform: macOS x64
            runner: macos-15-intel
            node: "22.x"
          - platform: macOS x64
            runner: macos-15-intel
            node: "24.x"
          - platform: macOS arm64
            runner: macos-15
            node: "22.x"
          - platform: macOS arm64
            runner: macos-15
            node: "24.x"
          - platform: Linux x64 glibc
            runner: ubuntu-24.04
            node: "22.x"
          - platform: Linux x64 glibc
            runner: ubuntu-24.04
            node: "24.x"
    steps:
      - name: Check out release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}

      - name: Download final npm tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-npm-package-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: release-output

      - name: Run ESM, CJS, WASM fallback, and fail-closed consumer smoke
        shell: bash
        run: |
          tarball="$(find release-output -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$tarball"
          node scripts/test-npm-consumer.mjs --tarball "$tarball"

  browser-integration:
    name: Browser bundler and MV3 integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: package
    steps:
      - name: Check out release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - name: Install Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.x"

      - name: Install locked bundler fixtures
        run: corepack pnpm install --frozen-lockfile --ignore-scripts

      - name: Download final npm tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-npm-package-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: release-output

      - name: Run Vite, webpack 5, esbuild, Browser, and MV3 smoke
        shell: bash
        env:
          SNWC_BROWSER: google-chrome
          SNWC_MV3_BROWSER: chromium
        run: |
          google-chrome --version
          chromium --version
          tarball="$(find release-output -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$tarball"
          node scripts/test-npm-bundlers.mjs --tarball "$tarball"
