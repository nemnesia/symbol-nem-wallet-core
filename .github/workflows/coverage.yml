name: Rust quality

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CORE_LINE_COVERAGE_TARGET: "90"
  CORE_FUNCTION_COVERAGE_TARGET: "90"
  CORE_BRANCH_COVERAGE_TARGET: "85"

jobs:
  checks:
    name: Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Check invisible characters in source
        run: python3 scripts/check-invisible-characters.py

      - name: Install wasm-bindgen CLI
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2
        with:
          tool: wasm-bindgen-cli@0.2.127

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features --locked

      - name: Run WASM tests
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: cargo test --target wasm32-unknown-unknown --features wasm --locked --lib

      - name: Check WASM target
        run: cargo check --target wasm32-unknown-unknown --features wasm --locked

      - name: Build Native C ABI
        run: cargo build --package symbol-nem-wallet-core-native --release --locked

      - name: Compile public C ABI header
        run: cc -std=c11 -Wall -Wextra -Werror -I bindings/native/include -fsyntax-only bindings/native/tests/header_compile.c

      - name: Run Native C ABI runtime test
        run: ./bindings/native/tests/run_c_abi_runtime.sh

      - name: Run Native C ABI runtime test with sanitizers
        env:
          SNWC_C_ABI_SANITIZERS: "1"
        run: ./bindings/native/tests/run_c_abi_runtime.sh

  core-coverage:
    name: Core coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2
        with:
          tool: cargo-llvm-cov

      - name: Measure Core coverage
        run: |
          mkdir -p coverage
          cargo llvm-cov \
            --package symbol-nem-wallet-core \
            --all-features \
            --locked \
            --json \
            --output-path coverage/core.json

      - name: Write uncovered-line report
        run: |
          cargo llvm-cov report \
            --package symbol-nem-wallet-core \
            --text \
            --show-missing-lines \
            --output-path coverage/core.txt

      - name: Enforce line and function targets
        run: |
          cargo llvm-cov report \
            --package symbol-nem-wallet-core \
            --fail-under-lines "$CORE_LINE_COVERAGE_TARGET" \
            --fail-under-functions "$CORE_FUNCTION_COVERAGE_TARGET"

      - name: Upload Core coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-coverage
          path: coverage/

  core-branch-coverage:
    name: Core branch coverage (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # cargo-llvm-cov documents --branch as unstable and does not provide a
    # --fail-under-branches option, so this result is reported separately.
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install nightly Rust toolchain
        uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
        with:
          toolchain: nightly
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2
        with:
          tool: cargo-llvm-cov

      - name: Measure Core branch coverage
        run: |
          mkdir -p coverage
          cargo llvm-cov \
            --package symbol-nem-wallet-core \
            --all-features \
            --locked \
            --branch \
            --json \
            --summary-only \
            --output-path coverage/core-branch.json

      - name: Print branch coverage result
        if: always()
        run: |
          if test -f coverage/core-branch.json; then
            echo "Branch coverage target: ${CORE_BRANCH_COVERAGE_TARGET}%"
            jq '.data[0].totals.branches' coverage/core-branch.json
          fi

      - name: Upload Core branch coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-branch-coverage
          path: coverage/
