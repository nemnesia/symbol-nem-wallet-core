name: Rust quality

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CORE_LINE_COVERAGE_TARGET: "90"
  CORE_FUNCTION_COVERAGE_TARGET: "90"
  CORE_BRANCH_COVERAGE_TARGET: "85"

jobs:
  checks:
    name: Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Select checks for changed pull request paths
        if: github.event_name == 'pull_request'
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          rust=false
          wasm=false
          native=false
          git diff --name-only --no-renames -z "$BASE_SHA" HEAD > "$RUNNER_TEMP/pr-paths"
          while IFS= read -r -d '' path; do
            case "$path" in
              Cargo.toml|Cargo.lock|crates/core/*|scripts/*|.github/workflows/*)
                rust=true; wasm=true; native=true ;;
              crates/wasm/*) rust=true; wasm=true ;;
              crates/c-abi/*) rust=true; native=true ;;
              crates/*|fuzz/*) rust=true ;;
              .node-version|package.json|pnpm-lock.yaml|pnpm-workspace.yaml)
                wasm=true ;;
            esac
          done < "$RUNNER_TEMP/pr-paths"
          {
            echo "rust=$rust"
            echo "wasm=$wasm"
            echo "native=$native"
          } >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install Node.js 24
        if: github.event_name != 'pull_request' || steps.changes.outputs.wasm == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Install wasm32 target
        if: github.event_name != 'pull_request' || steps.changes.outputs.wasm == 'true'
        run: rustup target add wasm32-unknown-unknown

      - name: Install lockfile-matched WASM tools
        if: github.event_name != 'pull_request' || steps.changes.outputs.wasm == 'true'
        run: bash scripts/ci/install-wasm-tools.sh all "$RUNNER_TEMP/snwc-wasm-tools"

      # Keep the required check name; affected PRs also run behavioral and binding checks.
      - name: Run fast Rust pull request checks
        if: github.event_name == 'pull_request' && steps.changes.outputs.rust != 'true'
        run: bash scripts/check-local.sh rust-fast

      - name: Run shared Rust checks (including locked fuzz targets)
        if: github.event_name != 'pull_request' || steps.changes.outputs.rust == 'true'
        run: bash scripts/check-local.sh rust

      - name: Run shared WASM checks
        if: github.event_name != 'pull_request' || steps.changes.outputs.wasm == 'true'
        run: bash scripts/check-local.sh wasm

      - name: Run shared Native C ABI checks
        if: github.event_name != 'pull_request' || steps.changes.outputs.native == 'true'
        run: bash scripts/check-local.sh native

      - name: Run shared Native C ABI sanitizer checks
        if: github.event_name != 'pull_request' || steps.changes.outputs.native == 'true'
        run: bash scripts/check-local.sh native-sanitizers

  core-coverage:
    name: Core coverage
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2
        with:
          tool: cargo-llvm-cov

      - name: Measure and enforce Core coverage
        run: bash scripts/ci/coverage.sh

      - name: Upload Core coverage report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: core-coverage
          path: coverage/

  core-branch-coverage:
    name: Core branch coverage (informational)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # cargo-llvm-cov documents --branch as unstable and does not provide a
    # --fail-under-branches option, so this result is reported separately.
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install nightly Rust toolchain
        uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly
        with:
          toolchain: nightly
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2
        with:
          tool: cargo-llvm-cov

      - name: Measure Core branch coverage
        run: |
          mkdir -p coverage
          cargo llvm-cov \
            --package symbol-nem-wallet-core \
            --all-features \
            --locked \
            --branch \
            --json \
            --summary-only \
            --output-path coverage/core-branch.json

      - name: Print branch coverage result
        if: always()
        run: |
          if test -f coverage/core-branch.json; then
            echo "Branch coverage target: ${CORE_BRANCH_COVERAGE_TARGET}%"
            jq '.data[0].totals.branches' coverage/core-branch.json
          fi

      - name: Upload Core branch coverage report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: core-branch-coverage
          path: coverage/
