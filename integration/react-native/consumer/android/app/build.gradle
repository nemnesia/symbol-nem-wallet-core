apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * React Native Android appの設定blockである。
 * 通常は追加設定不要で、必要な行だけcommentを解除する。
 */
react {
    /* directory設定 */
    //   package.jsonがあるproject root。標準値は'../..'。
    // root = file("../../")
    //   react-native npm packageのdirectory。標準値は../../node_modules/react-native。
    // reactNativeDir = file("../../node_modules/react-native")
    //   react-native Codegen packageのdirectory。標準値は../../node_modules/@react-native/codegen。
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   React Native CLI entry pointのcli.js。標準値は../../node_modules/react-native/cli.js。
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* variant設定 */
    //   debug対象variantの一覧。対象variantではJS bundleとassetのbundleを省略する。
    //   標準値は"debug"と"debugOptimized"。lite、prodなどのflavorを追加する場合は、
    //   debuggableVariantsにも列挙する。
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* bundle設定 */
    //   node commandとそのflagの一覧。標準値は'node'。
    // nodeExecutableAndArgs = ["node"]
    //
    //   bundle時に実行するcommand。標準値は'bundle'。
    // bundleCommand = "ram-bundle"
    //
    //   CLI設定fileのpath。標準値は空。
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   JS bundleを格納する生成asset fileの名前。
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   bundle生成のentry file。標準値は'index.android.js'または'index.js'。
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   'bundle' commandへ渡す追加flagの一覧。
    //   https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle を参照。
    // extraPackagerArgs = []

    /* Hermes command設定 */
    //   実行するHermes compiler command。標準値は'hermesc'。
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   Hermes compilerへ渡すflagの一覧。標準値は"-O"と"-output-source-map"。
    // hermesFlags = ["-O", "-output-source-map"]

    /* 自動link */
    autolinkLibrariesWithApp()
}

/**
 * trueにするとRelease build時にProguardを実行し、Java bytecodeを縮小する。
 */
def enableProguardInReleaseBuilds = false

/**
 * JavaScriptCore (JSC)で使用するbuild flavor。
 *
 * たとえばinternational variantを使う場合は次のように指定する。
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * international variantにはICU i18n libraryと必要なdataが含まれる。
 * これにより、en-US以外のlocaleでも`Date.toLocaleString`や`String.localeCompare`が適切に動作する。
 * このvariantは標準版よりarchitectureごとに約6 MiB大きい。
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.snwcrnbuild"
    defaultConfig {
        applicationId "com.snwcrnbuild"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // 注意: productionでは専用のkeystore fileを生成する。
            // https://reactnative.dev/docs/signed-apk-android を参照。
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // react-nativeのversionはReact Native Gradle Pluginが設定する。
    implementation("com.facebook.react:react-android")
    implementation(project(":symbol-nem-wallet-core"))

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
