apply plugin: "com.android.library"

// RN's library-side Codegen task owns the generated CMake target consumed by
// android/CMakeLists.txt. It must run in the same New Architecture build that
// autolinks this package; a compile-only React dependency is not sufficient.
if (project.hasProperty("newArchEnabled") && project.newArchEnabled == "true") {
    apply plugin: "com.facebook.react"
}

android {
    namespace "com.nemnesia.symbolnemwalletcore"
    compileSdkVersion rootProject.ext.has("compileSdkVersion") ? rootProject.ext.compileSdkVersion : 35

    defaultConfig {
        minSdkVersion 24
    }

    // RN CLI links the package C++ target into the application's appmodules
    // target. The published package supplies the corresponding prebuilt
    // library for every formal ABI; no consumer repository path or Gradle
    // property is required.
    sourceSets {
        main {
            jniLibs.srcDirs = ["../dist/react-native/android/jni"]
        }
    }
}

dependencies {
    // The host application supplies the RN version through the React Native
    // Gradle Plugin; this library only compiles against its public New
    // Architecture CxxReactPackage APIs.
    compileOnly("com.facebook.react:react-android")
}
