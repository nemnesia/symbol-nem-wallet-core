apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"

android {
    namespace "com.nemnesia.symbolnemwalletcore"
    compileSdkVersion rootProject.ext.has("compileSdkVersion") ? rootProject.ext.compileSdkVersion : 35

    defaultConfig {
        minSdkVersion 24
    }

    // RN CLIはpackageのC++ targetをアプリのappmodules targetへlinkする。
    // 公開packageは正式対応する各ABIのprebuilt libraryを提供するため、consumerのrepository pathや
    // Gradle propertyを必要としない。
    sourceSets {
        main {
            jniLibs.srcDirs = ["../dist/react-native/android/jni"]
        }
    }
}

dependencies {
    // React Native Gradle Pluginを通じてhost applicationがRN versionを指定する。
    // このlibraryは公開New Architecture CxxReactPackage APIに対してcompileする。
    compileOnly("com.facebook.react:react-android")
}
